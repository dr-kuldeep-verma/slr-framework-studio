      <stop offset="0" stop-color="#3b6ee6"/>
      <stop offset="1" stop-color="#23459e"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <g fill="#ffffff">
    <rect x="212" y="196" width="600" height="76" rx="38"/>
    <rect x="292" y="322" width="440" height="76" rx="38" opacity="0.92"/>
    <rect x="372" y="448" width="280" height="76" rx="38" opacity="0.84"/>
  </g>
  <g stroke="#cfdcfb" stroke-width="34" stroke-linecap="round">
    <line x1="512" y1="640" x2="334" y2="812"/>
    <line x1="512" y1="640" x2="690" y2="812"/>
    <line x1="334" y1="812" x2="690" y2="812"/>
  </g>
  <g fill="#ffffff">
